<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TagPicker</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #16142a;
        color: #eee;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .own {
        border: 1px solid #3a3560;
        background: #2a2550;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
      }
      .inh {
        border: 1px dashed #3a3560;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="inh" title="From the epic">#kunde-x</span><span class="own">#juridisk ×</span
      ><span class="inh">+ Add a tag</span>
    </div>
  </body>
</html>
